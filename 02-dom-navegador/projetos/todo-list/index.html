<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lista de tarefas</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="todo">
      <h1>Lista de tarefas</h1>
      <form id="task-form">
        <label class="visually-hidden" for="task-input">Nova tarefa</label>
        <input id="task-input" name="task" type="text" placeholder="O que precisa ser feito?" required />
        <button type="submit">Adicionar</button>
      </form>
      <ul id="task-list" aria-label="Tarefas"></ul>
      <p id="empty-message">Nenhuma tarefa por enquanto.</p>
    </main>
  </body>
</html>
